[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "M.Mezni", email = "mamezni@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openai>=3.53.0",
    "pydantic-settings>=2.16.3",
    "pypdf>=7.1.0",
    "python-docx>=1.2.0",
    "tiktoken>=0.14.0",
]

[project.scripts]
production-rag = "rag:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
